# .tmux.conf


#――――――――――――――――――――――――――――――――
# plugins
#――――――――――――――――――――――――――――――――
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
# set -g @plugin 'fcsonline/tmux-thumbs'


#――――――――――――――――――――――――――――――――
# configs
#――――――――――――――――――――――――――――――――
set -g default-terminal 'tmux-256color'
set -g automatic-rename on
set -g status-interval 1
set -g prefix C-f
set -g status-keys vi
set -g mode-keys vi
set -g base-index 1
set -g mouse on
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM
set -g @continuum-restore off


#――――――――――――――――――――――――――――――――
# clipboard
#――――――――――――――――――――――――――――――――
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter
if-shell "uname | grep -q Darwin" {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy';
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy';
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy';
}


#――――――――――――――――――――――――――――――――
# styles
#――――――――――――――――――――――――――――――――
# terminal 16-color palette reference
# colour0  = black
# colour1  = red
# colour2  = green
# colour3  = yellow
# colour4  = blue
# colour5  = magenta
# colour6  = cyan
# colour7  = white
# colour8  = bright black/gray
# colour9  = bright red
# colour10 = bright green
# colour11 = bright yellow
# colour12 = bright blue
# colour13 = bright magenta
# colour14 = bright cyan
# colour15 = bright white
bground='#262626' # status bar color
active='colour7' # active text color
text='#777777'  # regular text color
pane='#A0A0A0'  # active pane color
fade='#373737'  # faded text color
border='#575757'  # regular text color
select='colour7'  # select text color
warn='colour3'  # warn text color
left="#[fg=$text](#[fg=$select]###[fg=$text])#[fg=$select] >"
I="#{?client_prefix,,#I}#[fg=$select]#{?client_prefix,#I,}#[fg=$text]"
status_session="#[fg=$text]#{?client_prefix,,(#S) ~}"
status_pressed="#[fg=$select]#{?client_prefix,$left,}"
set -g pane-border-style fg="$border"
set -g pane-active-border-style fg="$pane"
set -g mode-style "bg=$fade,fg=$active"
set -g status-style "bg=default,fg=default"
set -g status-justify "left"
set -g status-left "$status_session$status_pressed#[fg=$text] "
set -g status-right "#[fg=$border]#D###P #[fg=$text](%m-%d-%y|#[fg=$active]%T#[fg=$text])"
set -g window-status-current-format "#[fg=$text][ #[fg=$active]#I:#W:#F#[fg=$text] ]"
set -g window-status-format "#[fg=$text]($I:#W:#F)"
set -g message-style "bg=default,fg=$warn"


#――――――――――――――――――――――――――――――――
# hotkeys
#――――――――――――――――――――――――――――――――
bind a setw synchronize-panes
bind q set status
bind r source-file ~/.tmux.conf
bind v split-window -h
bind s split-window -v
bind P paste-buffer
bind f last-window


# enable tmux-thumbs
# set -g @thumbs-reverse enabled
# if-shell "uname | grep -q Darwin" \
#   "set -g @thumbs-command 'echo -n {} | pbcopy'" \
#   "set -g @thumbs-command 'echo -n {} | wl-copy'"

# init tmux plugin manager - keep at the very bottom of tmux.conf
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
