# colors are terminal palette names, so they follow the Terminal theme

add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"

[cmd_duration]
min_time = 3_000
style = "bright-black"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
